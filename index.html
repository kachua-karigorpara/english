  <style>

    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }

<body>
  <div id="__bundler_placeholder">Loading কারিগরপাড়া ইংলিশ ই-লার্নিং...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);

\">সম্পূর্ণ ফ্রি<\u002Fdiv><div style=\"color:#3d5a58;margin-top:6px\">কোনো ফি বা পেইড কোর্স নেই<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fdf1dc;border-radius:16px;padding:22px\"><div style=\"font-weight:700;font-size:20px\">বাংলায় ব্যাখ্যা<\u002Fdiv><div style=\"color:#5c4a22;margin-top:6px\">সহজ বাংলায় ইংরেজি ব্যাকরণ<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#e8f4f2;border-radius:16px;padding:22px\"><div style=\"font-weight:700;font-size:20px\">ধাপে ধাপে শেখা<\u002Fdiv><div style=\"color:#3d5a58;margin-top:6px\">শুরু থেকে নিজের গতিতে<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fdf1dc;border-radius:16px;padding:22px\"><div style=\"font-weight:700;font-size:20px\">মোবাইলে সহজ<\u002Fdiv><div style=\"color:#5c4a22;margin-top:6px\">ফোনে পড়ুন, যেকোনো সময়<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"grammar\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 6px;font-size:32px\">ইংরেজি ব্যাকরণ: Parts of Speech<\u002Fh2>\n<p style=\"margin:0 0 24px;color:#3d5a58;font-size:17px\">ইংরেজি শব্দ আট ভাগে বিভক্ত। প্রতিটির সংজ্ঞা ও উদাহরণ দেখুন।<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px\">\n<sc-for list=\"{{parts}}\" as=\"p\" hint-placeholder-count=\"8\">\n<div style=\"border:1px solid #d8e6e4;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:20px;color:{{accent}}\">{{p.en}}<\u002Fspan><span style=\"font-weight:600\">{{p.bn}}<\u002Fspan><\u002Fdiv>\n<div style=\"color:#3d5a58;line-height:1.6\">{{p.def}}<\u002Fdiv>\n<div style=\"background:#f1f7f6;border-radius:10px;padding:10px 12px;font-family:Poppins,sans-serif;font-size:15px;line-height:1.5\">{{p.eg}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tenses\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 6px;font-size:32px\">টেন্স (Tenses)<\u002Fh2>\n<p style=\"margin:0 0 24px;color:#3d5a58;font-size:17px\">ক্রিয়ার কাল ১২ প্রকার। প্রতিটির গঠন ও উদাহরণ নিচে।<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px\">\n<sc-for list=\"{{tenses}}\" as=\"t\" hint-placeholder-count=\"3\">\n<div style=\"background:#13302f;color:#ffffff;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-weight:700;font-size:22px\">{{t.name}}<\u002Fdiv>\n<sc-for list=\"{{t.rows}}\" as=\"r\" hint-placeholder-count=\"4\">\n<div style=\"border-top:1px solid rgba(255,255,255,0.2);padding-top:10px\"><div style=\"font-weight:600;color:#f6c46f\">{{r.k}}<\u002Fdiv><div style=\"font-family:Poppins,sans-serif;font-size:15px;margin-top:2px\">{{r.eg}}<\u002Fdiv><div style=\"font-size:14px;opacity:0.85;margin-top:2px\">{{r.rule}}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"articles\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 24px;font-size:32px\">আর্টিকেল: a, an, the<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px\">\n<div style=\"background:#e8f4f2;border-radius:18px;padding:24px\"><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:28px\">a<\u002Fdiv><p style=\"line-height:1.7;margin:8px 0\">ব্যঞ্জনধ্বনি দিয়ে শুরু শব্দের আগে বসে।<\u002Fp><div style=\"font-family:Poppins,sans-serif\">a book, a pen<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fdf1dc;border-radius:18px;padding:24px\"><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:28px\">an<\u002Fdiv><p style=\"line-height:1.7;margin:8px 0\">স্বরধ্বনি (a, e, i, o, u) দিয়ে শুরু শব্দের আগে বসে।<\u002Fp><div style=\"font-family:Poppins,sans-serif\">an apple, an hour<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#e8f4f2;border-radius:18px;padding:24px\"><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:28px\">the<\u002Fdiv><p style=\"line-height:1.7;margin:8px 0\">নির্দিষ্ট কোনো কিছু বোঝাতে বসে।<\u002Fp><div style=\"font-family:Poppins,sans-serif\">the sun, the Padma<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"sentences\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 6px;font-size:32px\">বাক্যের প্রকারভেদ ও গঠন<\u002Fh2>\n<p style=\"margin:0 0 24px;color:#3d5a58;font-size:17px\">ইংরেজি বাক্যের মূল গঠন: Subject + Verb + Object। অর্থ অনুযায়ী বাক্য চার প্রকার।<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px\">\n<sc-for list=\"{{sentences}}\" as=\"s\" hint-placeholder-count=\"4\">\n<div style=\"border:1px solid #d8e6e4;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:19px;color:{{accent}}\">{{s.en}}<\u002Fspan><span style=\"font-weight:600\">{{s.bn}}<\u002Fspan><\u002Fdiv>\n<div style=\"color:#3d5a58;line-height:1.6\">{{s.rule}}<\u002Fdiv>\n<div style=\"background:#f1f7f6;border-radius:10px;padding:10px 12px;font-family:Poppins,sans-serif;font-size:15px;line-height:1.5\">{{s.eg}}<\u002Fdiv>\n<div style=\"font-size:15px;color:#3d5a58\">{{s.bnEg}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"mistakes\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 6px;font-size:32px\">সাধারণ ভুল ও সঠিক রূপ<\u002Fh2>\n<p style=\"margin:0 0 24px;color:#3d5a58;font-size:17px\">যে ভুলগুলো আমরা সবচেয়ে বেশি করি, কারণসহ।<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px\">\n<sc-for list=\"{{mistakes}}\" as=\"m\" hint-placeholder-count=\"6\">\n<div style=\"border:1px solid #d8e6e4;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"font-family:Poppins,sans-serif;font-size:15px;color:#8a1f1f;text-decoration:line-through\">{{m.wrong}}<\u002Fdiv>\n<div style=\"font-family:Poppins,sans-serif;font-size:16px;color:#0b5a3a;font-weight:500\">{{m.right}}<\u002Fdiv>\n<div style=\"color:#3d5a58;line-height:1.6\">{{m.why}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"vocab\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 6px;font-size:32px\">প্রয়োজনীয় শব্দভান্ডার<\u002Fh2>\n<p style=\"margin:0 0 24px;color:#3d5a58;font-size:17px\">প্রতিদিনের ব্যবহারের শব্দ, বাংলা অর্থ ও বাক্যসহ।<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px\">\n<sc-for list=\"{{vocab}}\" as=\"v\" hint-placeholder-count=\"12\">\n<div style=\"background:#e8f4f2;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:18px\">{{v.w}}<\u002Fspan><span style=\"font-weight:600\">{{v.bn}}<\u002Fspan><\u002Fdiv>\n<div style=\"font-family:Poppins,sans-serif;font-size:14px;color:#3d5a58;line-height:1.5\">{{v.eg}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"speaking\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 6px;font-size:32px\">দৈনন্দিন কথোপকথন<\u002Fh2>\n<p style=\"margin:0 0 24px;color:#3d5a58;font-size:17px\">কথা বলার জন্য সহজ বাক্য, যা আজই ব্যবহার করতে পারবেন।<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px\">\n<sc-for list=\"{{phrases}}\" as=\"ph\" hint-placeholder-count=\"10\">\n<div style=\"background:#fdf1dc;border-radius:16px;padding:18px\">\n<div style=\"font-size:13px;font-weight:600;color:#7a5a1a\">{{ph.situ}}<\u002Fdiv>\n<div style=\"font-family:Poppins,sans-serif;font-size:17px;font-weight:500;margin-top:4px\">{{ph.en}}<\u002Fdiv>\n<div style=\"color:#5c4a22;margin-top:2px\">{{ph.bn}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"path\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 24px;font-size:32px\">শেখার ধাপ<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px\">\n<sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"4\">\n<div style=\"border:1px solid #d8e6e4;border-radius:18px;padding:22px\">\n<div style=\"width:38px;height:38px;border-radius:50%;background:{{accent}};color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700\">{{s.n}}<\u002Fdiv>\n<div style=\"font-weight:700;font-size:19px;margin-top:12px\">{{s.t}}<\u002Fdiv>\n<div style=\"color:#3d5a58;line-height:1.6;margin-top:4px\">{{s.d}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:32px 40px\">\n<div style=\"background:{{accent}};color:#ffffff;border-radius:24px;padding:40px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between\">\n<div style=\"flex:1 1 320px\"><div style=\"font-size:30px;font-weight:700\">আজই শুরু করুন, একদম ফ্রি<\u002Fdiv><div style=\"font-size:17px;margin-top:6px\">কচুয়া কারিগরপাড়ার সবার জন্য ইংরেজি শেখা হোক সহজ।<\u002Fdiv><\u002Fdiv>\n<a href=\"#grammar\" style=\"background:#f2a33a;color:#2b1a00;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:999px\">পড়া শুরু করুন<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer id=\"contact\" style=\"margin-top:16px;background:#13302f;color:#ffffff;padding:40px;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between\">\n<div style=\"flex:1 1 280px\"><div style=\"font-weight:700;font-size:22px\">কারিগরপাড়া ইংলিশ ই-লার্নিং<\u002Fdiv><div style=\"margin-top:8px;line-height:1.7;opacity:0.9\">কচুয়া, কারিগরপাড়া। ইংরেজি শেখার একটি ফ্রি অনলাইন উদ্যোগ।<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 220px;line-height:1.9\"><div style=\"font-weight:700\">যোগাযোগ<\u002Fdiv><div>ফোন: [আপনার ফো nd:#ffffff;cursor:pointer;font-size:20px;color:#13302f\">›<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:32px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n<div style=\"background:#e8f4f2;border-radius:16px;padding:22px\"><div style=\"font-weight:700;font-size:20px\">সম্পূর্ণ ফ্রি<\u002Fdiv><div style=\"color:#3d5a58;margin-top:6px\">কোনো ফি বা পেইড কোর্স নেই<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fdf1dc;border-radius:16px;padding:22px\"><div style=\"font-weight:700;font-size:20px\">বাংলায় ব্যাখ্যা<\u002Fdiv><div style=\"color:#5c4a22;margin-top:6px\">সহজ বাংলায় ইংরেজি ব্যাকরণ<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#e8f4f2;border-radius:16px;padding:22px\"><div style=\"font-weight:700;font-size:20px\">ধাপে ধাপে শেখা<\u002Fdiv><div style=\"color:#3d5a58;margin-top:6px\">শুরু থেকে নিজের গতিতে<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fdf1dc;border-radius:16px;padding:22px\"><div style=\"font-weight:700;font-size:20px\">মোবাইলে সহজ<\u002Fdiv><div style=\"color:#5c4a22;margin-top:6px\">ফোনে পড়ুন, যেকোনো সময়<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"grammar\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 6px;font-size:32px\">ইংরেজি ব্যাকরণ: Parts of Speech<\u002Fh2>\n<p style=\"margin:0 0 24px;color:#3d5a58;font-size:17px\">ইংরেজি শব্দ আট ভাগে বিভক্ত। প্রতিটির সংজ্ঞা ও উদাহরণ দেখুন।<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px\">\n\n<div style=\"border:1px solid #d8e6e4;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:20px;color:#0b6e6e\">{{p.en}}<\u002Fspan><span style=\"font-weight:600\">{{p.bn}}<\u002Fspan><\u002Fdiv>\n<div style=\"color:#3d5a58;line-height:1.6\">{{p.def}}<\u002Fdiv>\n<div style=\"background:#f1f7f6;border-radius:10px;padding:10px 12px;font-family:Poppins,sans-serif;font-size:15px;line-height:1.5\">{{p.eg}}<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tenses\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 6px;font-size:32px\">টেন্স (Tenses)<\u002Fh2>\n<p style=\"margin:0 0 24px;color:#3d5a58;font-size:17px\">ক্রিয়ার কাল ১২ প্রকার। প্রতিটির গঠন ও উদাহরণ নিচে।<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px\">\n\n<div style=\"background:#13302f;color:#ffffff;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font-weight:700;font-size:22px\">{{t.name}}<\u002Fdiv>\n\n<div style=\"border-top:1px solid rgba(255,255,255,0.2);padding-top:10px\"><div style=\"font-weight:600;color:#f6c46f\">{{r.k}}<\u002Fdiv><div style=\"font-family:Poppins,sans-serif;font-size:15px;margin-top:2px\">{{r.eg}}<\u002Fdiv><div style=\"font-size:14px;opacity:0.85;margin-top:2px\">{{r.rule}}<\u002Fdiv><\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"articles\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 24px;font-size:32px\">আর্টিকেল: a, an, the<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px\">\n<div style=\"background:#e8f4f2;border-radius:18px;padding:24px\"><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:28px\">a<\u002Fdiv><p style=\"line-height:1.7;margin:8px 0\">ব্যঞ্জনধ্বনি দিয়ে শুরু শব্দের আগে বসে।<\u002Fp><div style=\"font-family:Poppins,sans-serif\">a book, a pen<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fdf1dc;border-radius:18px;padding:24px\"><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:28px\">an<\u002Fdiv><p style=\"line-height:1.7;margin:8px 0\">স্বরধ্বনি (a, e, i, o, u) দিয়ে শুরু শব্দের আগে বসে।<\u002Fp><div style=\"font-family:Poppins,sans-serif\">an apple, an hour<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#e8f4f2;border-radius:18px;padding:24px\"><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:28px\">the<\u002Fdiv><p style=\"line-height:1.7;margin:8px 0\">নির্দিষ্ট কোনো কিছু বোঝাতে বসে।<\u002Fp><div style=\"font-family:Poppins,sans-serif\">the sun, the Padma<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"sentences\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 6px;font-size:32px\">বাক্যের প্রকারভেদ ও গঠন<\u002Fh2>\n<p style=\"margin:0 0 24px;color:#3d5a58;font-size:17px\">ইংরেজি বাক্যের মূল গঠন: Subject + Verb + Object। অর্থ অনুযায়ী বাক্য চার প্রকার।<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px\">\n\n<div style=\"border:1px solid #d8e6e4;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:19px;color:#0b6e6e\">{{s.en}}<\u002Fspan><span style=\"font-weight:600\">{{s.bn}}<\u002Fspan><\u002Fdiv>\n<div style=\"color:#3d5a58;line-height:1.6\">{{s.rule}}<\u002Fdiv>\n<div style=\"background:#f1f7f6;border-radius:10px;padding:10px 12px;font-family:Poppins,sans-serif;font-size:15px;line-height:1.5\">{{s.eg}}<\u002Fdiv>\n<div style=\"font-size:15px;color:#3d5a58\">{{s.bnEg}}<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"mistakes\" style=\"padding:32px 40px\">\n<h2 style=\"margin:0 0 6px;font-size:32px\">সাধারণ ভুল ও সঠিক রূপ<\u002Fh2>\n<p style=\"margin:0 0 24px;color:#3d5a58;font-size:17px\">যে ভুলগুলো আমরা সবচেয়ে বেশি করি, কারণসহ।<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px\">\n\n<div style=\"border:1px solid #d8e6e4;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"font-family:Poppins,sans-serif;font-size:15px;color:#8a1f1f;text-decoration:line-through\">{{m.wrong}} eat(auto-fit,minmax(220px,1fr));gap:18px\">\n\n<div style=\"border:1px solid #d8e6e4;border-radius:18px;padding:22px\">\n<div style=\"width:38px;height:38px;border-radius:50%;background:#0b6e6e;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700\">{{s.n}}<\u002Fdiv>\n<div style=\"font-weight:700;font-size:19px;margin-top:12px\">{{s.t}}<\u002Fdiv>\n<div style=\"color:#3d5a58;line-height:1.6;margin-top:4px\">{{s.d}}<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:32px 40px\">\n<div style=\"background:#0b6e6e;color:#ffffff;border-radius:24px;padding:40px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between\">\n<div style=\"flex:1 1 320px\"><div style=\"font-size:30px;font-weight:700\">আজই শুরু করুন, একদম ফ্রি<\u002Fdiv><div style=\"font-size:17px;margin-top:6px\">কচুয়া কারিগরপাড়ার সবার জন্য ইংরেজি শেখা হোক সহজ।<\u002Fdiv><\u002Fdiv>\n<a href=\"#grammar\" style=\"background:#f2a33a;color:#2b1a00;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:999px\">পড়া শুরু করুন<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer id=\"contact\" style=\"margin-top:16px;background:#13302f;color:#ffffff;padding:40px;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between\">\n<div style=\"flex:1 1 280px\"><div style=\"font-weight:700;font-size:22px\">কারিগরপাড়া ইংলিশ ই-লার্নিং<\u002Fdiv><div style=\"margin-top:8px;line-height:1.7;opacity:0.9\">কচুয়া, কারিগরপাড়া। ইংরেজি শেখার একটি ফ্রি অনলাইন উদ্যোগ।<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 220px;line-height:1.9\"><div style=\"font-weight:700\">যোগাযোগ<\u002Fdiv><div>ফোন: [আপনার ফোন নম্বর]<\u002Fdiv><div>ইমেইল: [আপনার ইমেইল]<\u002Fdiv><div>ঠিকানা: [পূর্ণ ঠিকানা]<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 200px;line-height:1.9\"><div style=\"font-weight:700\">দ্রুত লিংক<\u002Fdiv><div><a href=\"#grammar\" style=\"color:#f6c46f\">ব্যাকরণ<\u002Fa><\u002Fdiv><div><a href=\"#tenses\" style=\"color:#f6c46f\">টেন্স<\u002Fa><\u002Fdiv><div><a href=\"#path\" style=\"color:#f6c46f\">শেখার ধাপ<\u002Fa><\u002Fdiv><\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0b6e6e&quot;,&quot;options&quot;:[&quot;#0b6e6e&quot;,&quot;#1d4ed8&quot;,&quot;#7c3aed&quot;,&quot;#b45309&quot;]}}\">\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { i: 0 }; }\n  componentDidMount() { this.t = setInterval(() => this.setState((s) => ({ i: (s.i + 1) % 3 })), 5500); }\n  componentWillUnmount() { clearInterval(this.t); }\n  renderVals() {\n    const accent = this.props.accent ?? '#0b6e6e';\n    const slides = [\n      { tag: 'ফ্রি ই-লার্নিং', title: 'বাংলায় শিখুন ইংরেজি ব্যাকরণ', text: 'কচুয়া কারিগরপাড়ার সবার জন্য সহজ বাংলা ব্যাখ্যা, উদাহরণ ও নিয়ম, কোনো খরচ ছাড়াই।', cta: 'ব্যাকরণ দেখুন', href: '#grammar', bg: accent, eg: 'I am a student.', egbn: 'আমি একজন ছাত্র।' },\n      { tag: 'টেন্স', title: '১২টি টেন্স সহজে বুঝুন', text: 'Present, Past ও Future এর গঠন ও উদাহরণ এক জায়গায়।', cta: 'টেন্স শিখুন', href: '#tenses', bg: '#1f4d4b', eg: 'She reads a book every day.', egbn: 'সে প্রতিদিন একটি বই পড়ে।' },\n      { tag: 'ধাপে ধাপে', title: 'শুরু থেকে নিজের গতিতে', text: 'Alphabet থেকে Sentence পর্যন্ত চার ধাপে পরিকল্পিত শেখার পথ।', cta: 'ধাপগুলো দেখুন', href: '#path', bg: '#8a4b0f', eg: 'We learn English together.', egbn: 'আমরা একসাথে ইংরেজি শিখি।' }\n    ];\n    const go = (n) => () => this.setState({ i: n });\n    const n = this.state.i;\n    return {\n      accent, cur: slides[n],\n      prev: () => this.setState({ i: (n + 2) % 3 }),\n      next: () => this.setState({ i: (n + 1) % 3 }),\n      dots: slides.map((s, k) => ({ label: 'স্লাইড ' + (k + 1), go: go(k), w: k === n ? '32px' : '12px', bg: k === n ? '#13302f' : '#b9d3d0' })),\n      parts: [\n        { en: 'Noun', bn: 'বিশেষ্য', def: 'ব্যক্তি, বস্তু, স্থান বা ধারণার নাম।', eg: 'Rahim lives in Dhaka.' },\n        { en: 'Pronoun', bn: 'সর্বনাম', def: 'বিশেষ্যের পরিবর্তে বসে।', eg: 'She is my sister.' },\n        { en: 'Adjective', bn: 'বিশেষণ', def: 'বিশেষ্য বা সর্বনামের গুণ বোঝায়।', eg: 'A tall boy.' },\n        { en: 'Verb', bn: 'ক্রিয়া', def: 'কাজ বা অবস্থা বোঝায়।', eg: 'They play football.' },\n        { en: 'Adverb', bn: 'ক্রিয়াবিশেষণ', def: 'ক্রিয়া বা বিশেষণকে বিশেষিত করে।', eg: 'He runs quickly.' },\n        { en: 'Preposition', bn: 'পদান্বয়ী অব্যয়', def: 'বিশেষ্যের সাথে অন্য শব্দের সম্পর্ক দেখায়।', eg: 'The book is on the table.' },\n        { en: 'Conjunction', bn: 'সংযোজক অব্যয়', def: 'শব্দ বা বাক্যকে যুক্ত করে।', eg: 'I like tea and coffee.' },\n        { en: 'Interjection', bn: 'আবেগসূচক অব্যয়', def: 'হঠাৎ আবেগ প্রকাশ করে।', eg: 'Wow! What a view.' }\n      ],\n      tenses: [\n        { name: 'Present', rows: [\n          { k: 'Indefinite', eg: 'I eat rice.', rule: 'Subject + verb (s/es)' },\n          { k: 'Continuous', eg: 'I am eating rice.', rule: 'am/is/are + verb-ing' },\n          { k: 'Perfect', eg: 'I have eaten rice.', rule: 'have/has + past participle' },\n          { k: 'Perfect Continuous', eg: 'I have been eating for an hour.', rule: 'have/has been + verb-ing' } ] },\n        { name: 'Past', rows: [\n          { k: 'Indefinite', eg: 'I ate rice.', rule: 'Subject + past verb' },\n          { k: 'Continuous', eg: 'I was eating rice.', rule: 'was/were + verb-ing' },\n          { k: 'Perfect', eg: 'I had eaten rice.', rule: 'had + past participle' },\n          { k: 'Perfect Continuous', eg: 'I had been eating for an hour.', rule: 'had been + verb-ing' } ] },\n        { name: 'Future', rows: [\n          { k: 'Indefinite', eg: 'I will eat rice.', rule: 'will/shall + verb' },\n          { k: 'Continuous', eg: 'I will be eating rice.', rule: 'will be + verb-ing' },\n          { k: 'Perfect', eg: 'I will have eaten rice.', rule: 'will have + past participle' },\n          { k: 'Perfect Continuous', eg: 'I will have been eating for an hour.', rule: 'will have been + verb-ing' } ] }\n      ],\n      sentences: [\n        { en: 'Assertive', bn: 'বর্ণনামূলক', rule: 'কোনো তথ্য বা মতামত জানায়। শেষে full stop বসে।', eg: 'The sun rises in the east.', bnEg: 'সূর্য পূর্ব দিকে ওঠে।' },\n        { en: 'Interrogative', bn: 'প্রশ্নবোধক', rule: 'প্রশ্ন করে। শেষে question mark বসে।', eg: 'Where do you live?', bnEg: 'তুমি কোথায় থাকো?' },\n        { en: 'Imperative', bn: 'আদেশসূচক', rule: 'আদেশ, অনুরোধ বা উপদেশ দেয়। Subject সাধারণত উহ্য থাকে।', eg: 'Please open the door.', bnEg: 'দয়া করে দরজা খোলো।' },\n        { en: 'Exclamatory', bn: 'বিস্ময়সূচক', rule: 'আবেগ প্রকাশ করে। শেষে exclamation mark বসে।', eg: 'What a beautiful day!', bnEg: 'কী সুন্দর দিন!' }\n      ],\n      mistakes: [\n        { wrong: 'He go to school.', right: 'He goes to school.', why: 'He, she, it এর সাথে Present Indefinite-এ verb-এর শেষে s/es বসে।' },\n        { wrong: 'I am agree with you.', right: 'I agree with you.', why: 'agree নিজেই verb, তাই am/is/are লাগে না।' },\n        { wrong: 'She is more taller than me.', right: 'She is taller than me.', why: 'taller নিজেই comparative, তাই আলাদা more লাগে না।' },\n        { wrong: 'I have a pen. It is a good pen. A pen is red.', right: 'I have a pen. It is a good pen. The pen is red.', why: 'আগে উল্লেখ করা নির্দিষ্ট জিনিসের আগে the বসে।' },\n        { wrong: 'He is a honest man.', right: 'He is an honest man.', why: 'honest শব্দের h উচ্চারিত হয় না, স্বরধ্বনি দিয়ে শুরু বলে an বসে।' },\n        { wrong: 'I did not went there.', right: 'I did not go there.', why: 'did এর পরে verb-এর মূল রূপ (base form) বসে।' }\n      ],\n      vocab: [\n        { w: 'Honest', bn: 'সৎ', eg: 'He is an honest man.' },\n        { w: 'Brave', bn: 'সাহসী', eg: 'The soldier is brave.' },\n        { w: 'Quick', bn: 'দ্রুত', eg: 'Be quick, we are late.' },\n        { w: 'Teacher', bn: 'শিক্ষক', eg: 'My teacher is kind.' },\n        { w: 'Village', bn: 'গ্রাম', eg: 'I live in a village.' },\n        { w: 'Market', bn: 'বাজার', eg: 'We go to the market.' },\n        { w: 'Library', bn: 'গ্রন্থাগার', eg: 'She reads in the library.' },\n        { w: 'Health', bn: 'স্বাস্থ্য', eg: 'Health is wealth.' },\n        { w: 'Improve', bn: 'উন্নতি করা', eg: 'Practice will improve your English.' },\n        { w: 'Understand', bn: 'বোঝা', eg: 'I understand the lesson.' },\n        { w: 'Remember', bn: 'মনে রাখা', eg: 'Please remember this rule.' },\n        { w: 'Practice', bn: 'অনুশীলন করা', eg: 'We practice every day.' }\n      ],\n      phrases: [\n        { situ: 'পরিচয়', en: 'My name is Rahim. Nice to meet you.', bn: 'আমার নাম রহিম। আপনার সাথে দেখা হয়ে ভালো লাগলো।' },\n        { situ: 'শুভেচ্ছা', en: 'How are you today?', bn: 'আজ কেমন আছেন?' },\n        { situ: 'সাহায্য চাওয়া', en: 'Could you help me, please?', bn: 'দয়া করে আমাকে একটু সাহায্য করবেন?' },\n        { situ: 'না বুঝলে', en: 'Sorry, could you say that again?', bn: 'দুঃখিত, কথাটা আরেকবার বলবেন?' },\n        { situ: 'ধন্যবাদ', en: 'Thank you very much.', bn: 'অনেক ধন্যবাদ।' },\n        { situ: 'দুঃখ প্রকাশ', en: 'I am sorry for being late.', bn: 'দেরি করার জন্য আমি দুঃখিত।' },\n        { situ: 'ঠিকানা জানতে', en: 'Where is the nearest bus stop?', bn: 'সবচেয়ে কাছের বাস স্টপ কোথায়?' },\n        { situ: 'দোকানে', en: 'How much is this?', bn: 'এটার দাম কত?' },\n        { situ: 'বিদায়', en: 'See you tomorrow. Take care.', bn: 'কাল দেখা হবে। নিজের খেয়াল রাখবেন।' }\n      ],\n      steps: [\n        { n: '১', t: 'Alphabet ও শব্দ', d: 'বর্ণমালা, উচ্চারণ ও প্রতিদিনের শব্দ শিখুন।' },\n        { n: '২', t: 'Parts of Speech', d: 'আট প্রকার শব্দের ধারণা পরিষ্কার করুন।' },\n        { n: '৩', t: 'Tenses ও Articles', d: 'সঠিক কাল ও আর্টিকেল ব্যবহার অনুশীলন করুন।' },\n        { n: '৪', t: 'বাক্য গঠন', d: 'নিজে ছোট বাক্য ও অনুচ্ছেদ লেখা শুরু করুন।' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
